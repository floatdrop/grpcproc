// The conversations service's contract: what a conversation's process
// accepts, what it publishes, and how one is opened. Another service depends
// on this package, never on the service.
syntax = "proto3";

package conversations.v1;

import "google/protobuf/empty.proto";
import "grpcproc/v1/options.proto";
import "guide/proto/tools/v1/tools.proto";

option go_package = "github.com/floatdrop/grpcproc/examples/guide/proto/conversations/v1;conversationsv1";

// Conversation is one conversation's process, registered as "conversation/"
// and its id: what it accepts, and the topic it publishes on.
// protoc-gen-grpcproc writes its address from this; address.go adds what
// every caller does first, opening it.
service Conversation {
  option (grpcproc.v1.process) = {prefix: "conversation/"};
  // Say tells the conversation what the user said, and returns once its
  // turn has begun: after the turns before it. The answer is published to
  // whoever follows the conversation.
  rpc Say(conversations.v1.Say) returns (Said);
  // Events is the conversation's topic: what the user says, every token of
  // its answers, the tools it calls, and the end of each turn.
  rpc Events(google.protobuf.Empty) returns (Event) {
    option (grpcproc.v1.topic) = {name: "events"};
  }
}

// Open is what the conversations supervisor starts a conversation from.
message Open {
  string id = 1;
}

// Say is what the user said. It is answered as its turn begins; the answer
// itself is published, as it comes, on the conversation's topic.
message Say {
  string text = 1;
}

message Said {
  // Which turn of the conversation this is, from 1.
  uint64 turn = 1;
}

// Event is what a conversation publishes on its topic.
message Event {
  uint64 turn = 1;
  // Which try at an answer a token belongs to, or a retrying begins: see
  // models.v1.Generate.
  uint64 attempt = 9;
  oneof kind {
    // What the user said: the turn begins.
    string said = 8;
    // The next piece of what the assistant says.
    string token = 2;
    // The model asked for a tool, which is now called.
    tools.v1.Run tool = 3;
    // What the tool answered.
    tools.v1.Ran ran = 4;
    // The answer starts over, and why: the node generating it was lost.
    string retrying = 5;
    // The turn is over.
    bool done = 6;
    // The turn failed, and why.
    string failed = 7;
  }
}
